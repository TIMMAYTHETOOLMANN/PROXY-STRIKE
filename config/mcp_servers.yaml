# MCP server connection profiles – production‑grade
servers:
  ethereum_mcp:
    type: gradio_rpc
    endpoint: "internal://gradio-eth-mcp"
    timeout_ms: 30000
    default_network: "ethereum_mainnet"  # mainnet recon enabled
    networks:
      mainnet:
        rpc: "https://eth.llamarpc.com"
        chain_id: 1
      sepolia:
        rpc: "https://rpc.sepolia.org"
        chain_id: 11155111
      local_testnet:
        rpc: "http://127.0.0.1:8545"
        chain_id: 31337

  hyperbrowser_mcp:
    type: internal_api
    endpoint: "internal://hyperbrowser"
    timeout_ms: 120000

  web_fetch_mcp:
    type: internal_api
    endpoint: "internal://web-fetch"
    timeout_ms: 30000

  bucket_store_mcp:
    type: internal_api
    endpoint: "internal://bucket-store"
    bucket: "redteam-operations"

  huggingface_mcp:
    type: internal_api
    endpoint: "internal://huggingface-hub"
    auth_principal: "timmaythetoolmann"
