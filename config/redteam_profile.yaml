# Engagement parameters
operation:
  name: "proxy-strike-full-engagement"
  mode: "production"  # hard production, no simulation stubs
  target_chains: ["ethereum_mainnet", "bsc_mainnet", "polygon_mainnet"]
  
  # Mainnet recon is READ-ONLY by design
  mainnet_recon:
    enabled: true
    max_contracts_per_scan: 1000
    rate_limit_rps: 5
    read_only: true  # enforced at orchestrator level

  # Execution is gated to testnet/authorized environments
  controlled_execution:
    enabled: true
    allowed_networks: ["sepolia", "local_testnet"]
    require_authorization: true
    
  # Reporting
  report_output: "bucket://redteam-operations/reports/"
  alert_channel: "bucket://redteam-operations/alerts/"
